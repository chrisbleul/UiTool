[project]
name = "uiflow"
version = "0.1.0"
description = "MVP UI automation tool for Windows desktop and web apps (YAML workflows)"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
    "Flask>=3.0",
    "openpyxl>=3.1",
    "playwright>=1.45",
    "pywinauto>=0.6.8; platform_system == 'Windows'",
    "Pillow>=10.0; platform_system == 'Windows'",
    "pynput>=1.7; platform_system == 'Windows'",
    "requests>=2.31",
    "keyring>=24.0",
    "croniter>=2.0",
    "pypdf>=4.0",
    "pytesseract>=0.3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.16.3"]

[project.scripts]
uiflow = "uiflow.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["uiflow*"]

[tool.ruff]
target-version = "py310"

# AP5.4: erste Einfuehrung eines Linters auf 13k+ Zeilen ohne jede
# vorherige statische Pruefung. ruff-format ist bewusst nicht Teil dieses
# Pakets -- "ruff format --check" haette 28 von 39 Dateien als
# nicht-konform gemeldet, reine Formatierungsdiffs ueber fast den
# gesamten Code. Das ist eine eigene, groessere Entscheidung, kein
# Nebeneffekt der Linter-Einfuehrung.
[tool.ruff.lint]
# ruffs eigener Default-Regelsatz ist deutlich breiter als der klassische
# E/F-Kern (siehe "ruff check --show-settings") -- unveraendert uebernommen,
# nicht selbst zusammengestellt.
