name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    uses: chrisbleul/CGOPlattform/.github/workflows/verify-python.yml@main
    with:
      verify-commands: |
        ruff check uiflow tests
        python -m pytest tests/ -q

  deploy:
    # Kein Docker/GHCR fuer diese App -- deploy.sh macht auf der Instanz ein
    # "git checkout <sha>" und startet den systemd-Service neu (siehe
    # infra/deploy.sh), deshalb hier direkt nach verify statt ueber einen
    # eigenen Image-Job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    uses: chrisbleul/CGOPlattform/.github/workflows/deploy.yml@main
    with:
      slug: uiflow
    secrets: inherit
